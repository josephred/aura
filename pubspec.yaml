name: aura
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  path: ^1.9.0
  connectivity_plus: ^7.2.0
  url_launcher: ^6.3.2
  google_sign_in: 6.3.0
  sqflite_sqlcipher: ^3.4.0
  flutter_secure_storage: ^10.3.1
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter_facebook_auth: ^7.2.0
  flutter_webrtc: ^1.5.2
  image_picker: ^1.1.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  # Symptom descriptor: on-device dictation (no per-minute cost) and voice
  # note recording for cases where the patient prefers to send audio.
  speech_to_text: ^7.3.0
  record: ^6.1.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  # Adaptive icon: el fondo lleva el gradiente y el foreground solo el escudo,
  # dimensionado para la zona segura (Android recorta el lienzo a un 66%).
  adaptive_icon_background: "assets/logo_bg.png"
  adaptive_icon_foreground: "assets/logo_fg.png"
  # iOS rechaza íconos con canal alfa.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
